name: CI

on:
  # push は main のみ（Deploy はこの run の成功を起点にする）。
  # feature ブランチは pull_request 側で検証し、push と二重に走らないようにする
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチで新しい push が来たら、走行中の古い run はキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm test

      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bookmarkquiz_test
        # .env.test と同じ localhost:5433 に合わせる
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d bookmarkquiz_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    # next dev / Auth.js / Prisma が要求する環境変数（本番値ではないダミー）
    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/bookmarkquiz_test
      AUTH_SECRET: ci-e2e-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      GITHUB_CLIENT_ID: dummy
      GITHUB_CLIENT_SECRET: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # Prisma Client は生成物が gitignore されているので CI で生成する
      - run: npx prisma generate

      # マイグレーションを適用し、schema.prisma と差分がないことを確認する。
      # schema.prisma だけ変えてマイグレーションを作り忘れた PR をここで落とす。
      - run: npx prisma migrate deploy

      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test
