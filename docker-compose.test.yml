services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: bookmarkquiz_test
    ports:
      - "5433:5432"
    # データはメモリ上（揮発）。コンテナを作り直せば毎回まっさらになる。
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d bookmarkquiz_test"]
      interval: 2s
      timeout: 3s
      retries: 15
